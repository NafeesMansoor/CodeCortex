name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Lint · Format · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Install optional extras (embeddings + clustering)
        run: |
          pip install faiss-cpu hdbscan umap-learn scikit-learn
        continue-on-error: true

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ --ignore=tests/benchmarks -q

      - name: Verify a single version source
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from codecortex.version import __version__
          installed = version("codecortex")
          assert installed == __version__, (
              f"packaging metadata says {installed} but codecortex.version says {__version__}"
          )
          print(f"version {__version__} consistent across code and packaging metadata")
          PY

      - name: Verify the CLI reports its version
        run: |
          test "$(codecortex --version)" = "CodeCortex $(python -c 'from codecortex.version import __version__; print(__version__)')"
          python -m codecortex --version

      - name: Validate release metadata generation
        run: python scripts/release_metadata.py --check-only

      - name: Build distribution packages
        run: |
          pip install build
          python -m build

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/
          retention-days: 7
