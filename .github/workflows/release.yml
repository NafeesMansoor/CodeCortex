name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # PyPI trusted publishing

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codecortex-engine/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Install dependencies and run tests
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
          pytest tests/ --ignore=tests/benchmarks -q

      - name: Verify tag matches the package version
        run: python scripts/release_metadata.py --tag "${GITHUB_REF_NAME}" --check-only

      - name: Build distribution packages
        run: python -m build

      - name: Verify distribution
        run: twine check dist/*

      - name: Verify built metadata carries the tagged version
        run: |
          python - <<'PY'
          import os, pathlib, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          names = [p.name for p in pathlib.Path("dist").iterdir()]
          if not any(tag in name for name in names):
              sys.exit(f"no artifact for {tag} in dist: {names}")
          print("artifacts:", ", ".join(names))
          PY

      # Runs before update.json lands in dist/: the action rejects any file
      # there that is not a wheel or sdist.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Generate release metadata
        run: |
          python scripts/release_metadata.py \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --output dist/update.json
          cat dist/update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/update.json
          generate_release_notes: true
          fail_on_unmatched_files: false
