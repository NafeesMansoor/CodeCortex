codecortex:
  # Traversal
  bfs_depth: 3
  max_nodes_per_query: 500

  # Graph construction
  enable_cpg: true           # include CFG/DFG/endpoint detection
  enable_embeddings: true    # build FAISS embedding index
  enable_clustering: true    # HDBSCAN semantic clustering
  centrality_ranking: true   # weight retrieval by PageRank/betweenness

  # Hybrid two-tier mode:
  # Set true to skip CFG/DFG at build time and expand lazily per query.
  on_demand_cfg: false
  on_demand_dfg: false

  # Embedding provider: stub | local | openai
  embedding_backend: stub
  embedding_dimensions: 384

  # Clustering
  min_cluster_size: 5

  # Retrieval
  retrieval_top_k: 20
  token_budget: 4000
  min_semantic_score: 0.0

  # Honour the repository .gitignore while walking
  respect_gitignore: true

  # Extra paths to exclude, on top of the built-in directory exclusions
  # (virtualenvs, node_modules, vendor, site-packages, caches, build output,
  # VCS metadata — see core.file_walker.DEFAULT_EXCLUDED_DIRS).
  exclude_paths:
    - storage
    - bootstrap/cache

  # Uncomment to replace the built-in directory list entirely:
  # exclude_dirs: [.venv, node_modules, vendor]
