[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codecortex"
dynamic = ["version"]
description = "Adaptive semantic intelligence engine for large-scale code understanding"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["code-intelligence", "semantic-analysis", "graph", "embeddings", "retrieval", "visualization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Both bounds are load-bearing — see requirements.txt. In short: 1.14
    # changed the parser API, and tree-sitter 0.26.0 segfaults on start_point.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.14,<2",
    # Grammar wheels — parsing must not depend on a runtime download.
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-javascript>=0.23,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
    "tree-sitter-php>=0.23,<1.0",
    "networkx>=3.1",
    "faiss-cpu>=1.7",
    "numpy>=2.2.6",
    "pyyaml>=6.0",
    # CA bundle for update checks — see requirements.txt.
    "certifi>=2023.7",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.6",
    "torch>=2.0",
]
lsp = [
    "jedi>=0.19",
    "pygls>=1.0",
]
clustering = [
    "hdbscan>=0.8",
    "umap-learn>=0.5",
    "scikit-learn>=1.3",
]
all = [
    "codecortex[embeddings,lsp,clustering]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.8",
]

[project.scripts]
codecortex = "codecortex.cli:main"
cx = "codecortex.cli:main"

[project.urls]
Repository = "https://github.com/NafeesMansoor/codecortex"
Documentation = "https://github.com/NafeesMansoor/codecortex#readme"

[tool.setuptools.dynamic]
version = { attr = "codecortex.version.__version__" }

[tool.setuptools.packages.find]
include = [
    "codecortex*",
    "core*",
    "graph*",
    "indexing*",
    "embeddings*",
    "clustering*",
    "traversal*",
    "ranking*",
    "retrieval*",
    "pipeline*",
    "performance*",
    "visualization*",
]

[tool.setuptools.package-data]
visualization = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
